# AUTOMATION-02: filtro y buzón de avisos, sin IA.
# Este archivo en una rama PR NO se ejecuta hasta fusionarse expresamente en main.
name: Handoff push inbox (sin IA)

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

concurrency:
  group: push-inbox-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  relay:
    # Sin runner para issues normales, bots, otros usuarios ni la PR-buzon.
    if: >-
      github.event.issue.pull_request != null &&
      github.event.issue.number != 30 &&
      github.event.comment.user.login == 'astislasti-dotcom' &&
      contains(github.event.comment.body, '<!-- handoff:')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
      pull-requests: read
    steps:
      - name: Leer codigo auditado en main, nunca codigo de la PR origen
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      - name: Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Filtrar y publicar un aviso deduplicado
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HANDOFF_INBOX_PR: "30"
        run: node scripts/automation/relay-to-inbox.mjs
